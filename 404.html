<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page en construction | Sébastien Feser</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .lang-selector {
            display: flex;
            gap: 2px;
            margin-left: 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 2px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.4rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .lang-btn:hover {
            color: var(--text-primary);
            background: var(--bg-secondary);
        }
        .lang-btn.active {
            background: var(--accent);
            color: white;
        }
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .error-icon {
            font-size: 6rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .construction-bar {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .construction-progress {
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            border-radius: 4px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <main class="error-page">
        <div class="error-icon">🚧</div>
        <div class="error-code">404</div>
        <h1 class="error-title" data-i18n="error.title">Page under construction</h1>
        <div class="construction-bar">
            <div class="construction-progress"></div>
        </div>
        <p class="error-message" data-i18n="error.message">
            This page doesn't exist yet or is currently under development.
            Come back soon to discover new content!
        </p>
        <div class="error-links">
            <a href="index.html" class="btn btn-primary" data-i18n="error.back_home">Back to home</a>
            <a href="index.html#contact" class="btn btn-outline" data-i18n="error.contact">Contact me</a>
        </div>
    </main>


    <script src="js/layout.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/effects-toggle.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/hero-shader.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/card-tilt.js"></script>
    <script src="js/easter-egg.js"></script>
    <script src="js/konami-physics.js"></script>
    <script src="js/command-console.js"></script>
    <script src="js/debug-mode.js"></script>
    <script src="js/horror-fire.js"></script>
    <script src="js/matrix-rain.js"></script>
    <script src="js/i18n.js"></script>
</body>
</html>
